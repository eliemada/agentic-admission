<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EPFL ISA — Internship Report Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/libsodium-wrappers@0.7.13/dist/modules/libsodium-wrappers.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            epfl: { red: '#c4122f', dark: '#a00e26' },
          },
        },
      },
    };
  </script>
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .spinner { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse-bar {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    .progress-indeterminate {
      background: linear-gradient(90deg, transparent, #c4122f, transparent);
      animation: slide 1.5s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-epfl-red">EPFL ISA</h1>
      <p class="text-gray-500 mt-1">Internship Report Generator</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-xl shadow-lg p-8">

      <!-- Form -->
      <form id="form" class="space-y-5">
        <div>
          <label for="username" class="block text-sm font-medium text-gray-700 mb-1">
            ISA Username
          </label>
          <input
            id="username"
            type="text"
            required
            autocomplete="username"
            placeholder="firstname.lastname"
            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-epfl-red focus:border-transparent outline-none transition"
          />
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
            ISA Password
          </label>
          <input
            id="password"
            type="password"
            required
            autocomplete="current-password"
            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-epfl-red focus:border-transparent outline-none transition"
          />
        </div>

        <div>
          <label for="faculty" class="block text-sm font-medium text-gray-700 mb-1">
            Faculty
          </label>
          <select
            id="faculty"
            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-epfl-red focus:border-transparent outline-none transition bg-white"
          >
            <option value="ic">IC — Computer & Communication Sciences</option>
          </select>
        </div>

        <button
          id="submit-btn"
          type="submit"
          class="w-full py-3 bg-epfl-red hover:bg-epfl-dark text-white font-semibold rounded-lg transition duration-200 shadow-sm hover:shadow"
        >
          Generate Report
        </button>
      </form>

      <!-- Loading state -->
      <div id="loading" class="hidden text-center py-6">
        <div class="inline-block w-8 h-8 border-4 border-gray-200 border-t-epfl-red rounded-full spinner mb-4"></div>
        <p id="loading-text" class="text-gray-600 text-sm">Connecting to ISA portal...</p>
        <div class="mt-4 w-full bg-gray-200 rounded-full h-2 overflow-hidden">
          <div class="h-full w-full progress-indeterminate"></div>
        </div>
        <p class="text-gray-400 text-xs mt-3">This may take up to a minute</p>
      </div>

      <!-- Error state -->
      <div id="error" class="hidden mt-4 p-4 bg-red-50 border border-red-200 rounded-lg">
        <p class="text-red-700 text-sm" id="error-text"></p>
      </div>

      <!-- Success state -->
      <div id="success" class="hidden mt-4 text-center py-4">
        <svg class="mx-auto h-12 w-12 text-green-500 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <p class="text-gray-700 font-medium" id="success-text">Report ready!</p>
      </div>
    </div>

    <!-- Footer -->
    <p class="text-center text-gray-400 text-xs mt-6">
      Your credentials are end-to-end encrypted with NaCl sealed boxes.<br />
      They are never stored — used only to log in to ISA, then discarded.
    </p>
  </div>

  <script>
    const form = document.getElementById('form');
    const loading = document.getElementById('loading');
    const loadingText = document.getElementById('loading-text');
    const errorDiv = document.getElementById('error');
    const errorText = document.getElementById('error-text');
    const successDiv = document.getElementById('success');
    const successText = document.getElementById('success-text');
    const submitBtn = document.getElementById('submit-btn');

    function showState(state) {
      form.classList.toggle('hidden', state !== 'form');
      loading.classList.toggle('hidden', state !== 'loading');
      errorDiv.classList.toggle('hidden', state !== 'error');
      successDiv.classList.toggle('hidden', state !== 'success');
    }

    function showError(msg) {
      errorText.textContent = msg;
      showState('form');
      errorDiv.classList.remove('hidden');
      submitBtn.disabled = false;
    }

    const LOADING_MESSAGES = [
      'Connecting to ISA portal...',
      'Logging in...',
      'Scraping internship offers...',
      'This may take a moment — fetching details...',
      'Almost there — building your report...',
    ];

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorDiv.classList.add('hidden');
      submitBtn.disabled = true;

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const faculty = document.getElementById('faculty').value;

      if (!username || !password) {
        showError('Please fill in both fields.');
        return;
      }

      showState('loading');

      // Rotate loading messages
      let msgIndex = 0;
      const msgInterval = setInterval(() => {
        msgIndex = Math.min(msgIndex + 1, LOADING_MESSAGES.length - 1);
        loadingText.textContent = LOADING_MESSAGES[msgIndex];
      }, 8000);

      try {
        // 1. Wait for libsodium
        await sodium.ready;

        // 2. Fetch public key
        const pkResp = await fetch('/api/public-key');
        if (!pkResp.ok) throw new Error('Failed to fetch encryption key.');
        const { public_key } = await pkResp.json();
        const pkBytes = sodium.from_base64(public_key, sodium.base64_variants.ORIGINAL);

        // 3. Encrypt credentials
        const payload = JSON.stringify({ username, password });
        const payloadBytes = sodium.from_string(payload);
        const encrypted = sodium.crypto_box_seal(payloadBytes, pkBytes);
        const encryptedB64 = sodium.to_base64(encrypted, sodium.base64_variants.ORIGINAL);

        // 4. Generate report
        loadingText.textContent = 'Logging in...';
        const genResp = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ encrypted: encryptedB64, faculty }),
        });

        clearInterval(msgInterval);

        if (!genResp.ok) {
          const err = await genResp.json().catch(() => ({ detail: 'Unknown error' }));
          throw new Error(err.detail || `Server error (${genResp.status})`);
        }

        // 5. Download the file
        const blob = await genResp.blob();
        const contentDisp = genResp.headers.get('Content-Disposition') || '';
        const fallback = genResp.headers.get('X-Fallback');
        const filename = fallback
          ? 'isa-report.typ'
          : contentDisp.match(/filename=(.+)/)?.[1] || 'isa-report.pdf';

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);

        if (fallback) {
          successText.textContent = 'Typst source downloaded (PDF compiler unavailable on server).';
        } else {
          successText.textContent = 'PDF report downloaded!';
        }
        showState('success');

        // Reset after a few seconds
        setTimeout(() => {
          showState('form');
          submitBtn.disabled = false;
        }, 5000);

      } catch (err) {
        clearInterval(msgInterval);
        showError(err.message);
      }
    });
  </script>
</body>
</html>
