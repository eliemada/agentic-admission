name: Test

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true  # Cancel stale runs when new push arrives

jobs:
  test:
    name: Python 3.13
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "latest"
          enable-cache: true  # Cache uv dependencies

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src tests

      - name: Type check
        run: uv run ty check src

      - name: Test (skip slow ML integration tests)
        run: uv run coverage run -m pytest -m "not slow" && uv run coverage report

      # Full failure surface: re-run without --exitfirst so one failure
      # cannot mask the rest (see README "CI runs the full suite").
      - name: Test (full failure report, no exitfirst)
        run: uv run pytest -m "not slow" -ra --tb=no -o addopts=""
