[build-system]  # https://docs.astral.sh/uv/concepts/projects/config/#build-systems
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]  # https://packaging.python.org/en/latest/specifications/pyproject-toml/
name = "agentic-admission"
version = "0.0.0"
description = "Multi-agent system for MTE admission decision support at EPFL, running LLMs locally on SCITAS HPC clusters."
authors = [
  { name = "Elie BRUNO", email = "contact@eliebruno.com" },
]
requires-python = ">=3.13,<4.0"
dependencies = [
  "docling>=2.77.0",
  "gliner>=0.2.25",
  "loguru (>=0.7.3)",
  "openpyxl (>=3.1.5)",
  "poethepoet (>=0.32.1)",
  "presidio-analyzer>=2.2.361",
  "presidio-anonymizer>=2.2.361",
  "pyarrow>=23.0.1",
  "pydantic (>=2.10.0)",
  "pydantic-settings (>=2.7.0)",
]

[project.scripts]
agentic-admission = "agentic_admission.main:run"

[dependency-groups]  # https://docs.astral.sh/uv/concepts/projects/dependencies/#development-dependencies
dev = [
  "altair>=6.0.0",
  "coverage[toml] (>=7.6.10)",
  "marimo>=0.20.2",
  "pandas>=2.1.4",
  "pre-commit (>=4.0.1)",
  "pytest (>=8.3.4)",
  "pytest-asyncio (>=0.24.0)",
  "pytest-mock (==3.15.1)",
  "ruff (>=0.9.2)",
  "ty (>=0.0.14)",
  "typeguard (>=4.4.1)",
]

[tool.coverage.report]  # https://coverage.readthedocs.io/en/latest/config.html#report
fail_under = 40
precision = 1
show_missing = true
skip_covered = true

[tool.coverage.run]  # https://coverage.readthedocs.io/en/latest/config.html#run
branch = true
command_line = "--module pytest"
data_file = "reports/.coverage"
source = ["src"]

[tool.coverage.xml]  # https://coverage.readthedocs.io/en/latest/config.html#xml
output = "reports/coverage.xml"

[tool.pytest.ini_options]  # https://docs.pytest.org/en/latest/reference/reference.html#ini-options-ref
addopts = "--color=yes --doctest-modules --exitfirst --failed-first --strict-config --strict-markers --verbosity=2 --junitxml=reports/pytest.xml"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error", "ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
testpaths = ["src", "tests"]
xfail_strict = true

[tool.ruff]  # https://docs.astral.sh/ruff/settings/
fix = true
line-length = 100
src = ["src", "tests"]
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["ALL"]
ignore = ["ANN401", "CPY", "FIX", "ARG001", "BLE001", "COM812", "D203", "D213", "E501", "PD008", "PD009", "PLR0913", "RET504", "S101", "TC001", "TD002", "TD003", "TRY003", "TRY300"]
unfixable = ["ERA001", "F401", "F841", "T201", "T203"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "ANN001",   # Missing type annotation for function argument
    "ANN201",   # Missing return type annotation
    "ARG002",   # Unused method argument (pytest fixtures)
    "D101",     # Missing docstring in public class (test classes)
    "D102",     # Missing docstring in public method (test methods)
    "D401",     # First line should be imperative mood
    "DTZ005",   # datetime.now() without tz argument
    "ERA001",   # Commented-out code (section dividers in tests)
    "FBT001",   # Boolean positional argument
    "FBT002",   # Boolean default value positional argument
    "PLC0415",  # Lazy imports inside test functions
    "PLR2004",  # Magic value in comparison
    "S105",     # Possible hardcoded password (string)
    "S106",     # Possible hardcoded password (function arg)
    "S108",     # Hardcoded temporary paths in test data
    "S110",     # try-except-pass (used for immutability checks)
    "SIM105",   # contextlib.suppress alternative (test readability)
    "SLF001",   # Private member access
    "TC003",    # stdlib imports used at runtime for type annotations
]
"src/agentic_admission/preprocessing/text_extraction.py" = [
    "PLC0415",  # Lazy imports: avoid loading PyTorch/Docling at import time
]
"src/agentic_admission/anonymizer/presidio_pipeline.py" = [
    "PLC0415",  # Lazy imports: avoid loading spaCy/Presidio at import time
]
"src/agentic_admission/anonymizer/post_filters.py" = [
    "PLC0415",  # Lazy import: avoid circular import with config at module level
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.poe.executor]  # https://github.com/nat-n/poethepoet
type = "simple"

[tool.poe.tasks]

  [tool.poe.tasks.lint]
  help = "Lint this app"
  cmd = """
    pre-commit run
      --all-files
      --color always
    """

  [tool.poe.tasks.typecheck]
  help = "Type check with ty"
  cmd = "ty check src"

  [tool.poe.tasks.test]
  help = "Test this app"

    [[tool.poe.tasks.test.sequence]]
    cmd = "coverage run"

    [[tool.poe.tasks.test.sequence]]
    cmd = "coverage report"

    [[tool.poe.tasks.test.sequence]]
    cmd = "coverage xml"

  [tool.poe.tasks.extract]
  help = "Extract all Excel files to Parquet"
  cmd = "uv run python -m agentic_admission.extraction.pipeline"

  [tool.poe.tasks.eda]
  help = "Open the EDA notebook in the browser"
  cmd = "marimo edit notebooks/eda.py"

  [tool.poe.tasks.dossier-eda]
  help = "Open the dossier EDA notebook in the browser"
  cmd = "marimo edit notebooks/dossier_eda.py"

  [tool.poe.tasks.export-eda]
  help = "Export EDA notebook to reports/eda.html"
  cmd = "marimo export html notebooks/eda.py -o reports/eda.html"

  [tool.poe.tasks.export-dossier-eda]
  help = "Export dossier EDA notebook to reports/dossier_eda.html"
  cmd = "marimo export html notebooks/dossier_eda.py -o reports/dossier_eda.html"

  [tool.poe.tasks.filetype-eda]
  help = "Open the file-type EDA notebook in the browser"
  cmd = "marimo edit notebooks/filetype_eda.py"

  [tool.poe.tasks.export-filetype-eda]
  help = "Export file-type EDA notebook to reports/filetype_eda.html"
  cmd = "marimo export html notebooks/filetype_eda.py -o reports/filetype_eda.html"

  [tool.poe.tasks.normalize-files]
  help = "Copy dossiers to processed/ with fixed filenames and docx→pdf conversion"
  cmd = "python -m agentic_admission.preprocessing.normalize_files"

  [tool.poe.tasks.strip-passports]
  help = "Record passport/ID presence and delete the files"
  cmd = "python -m agentic_admission.anonymizer.strip_passports --delete"

  [tool.poe.tasks.setup-nlp]
  help = "Download spaCy tokenization model (one-time setup)"
  cmd = "uv pip install en_core_web_sm@https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"

  [tool.poe.tasks.extract-text]
  help = "Convert dossier PDFs to Markdown using Docling"
  cmd = "python -m agentic_admission.preprocessing.text_extraction"

  [tool.poe.tasks.anonymize]
  help = "Detect and redact PII from extracted Markdown files"
  cmd = "python -m agentic_admission.anonymizer.presidio_pipeline"

  [tool.poe.tasks.ingest]
  help = "Ingest dossiers from ZIP/TAR/directory into staging"
  cmd = "python -m agentic_admission.intake.adapter"

  [tool.poe.tasks.run]
  help = "Run the admission agent"
  cmd = "uv run python -m agentic_admission.main"
